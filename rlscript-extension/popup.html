<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; margin: 0; font-family: "Segoe UI", sans-serif; background: #16161a; color: #e8e8ec; }
    .wrap { padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .ver { font-size: 9.5px; font-weight: 500; letter-spacing: 0.2px;
           color: rgba(255,255,255,0.55); background: none; border: none;
           padding: 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; }
    .dot.on { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .dot.warn { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    .row { font-size: 12px; opacity: 0.85; margin: 6px 0; }
    button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 8px; cursor: pointer; font-size: 12px; }
    .ghost { background: rgba(255,255,255,0.08); color: #e8e8ec; }
    .sec-title { font-size: 11px; font-weight: 600; letter-spacing: 0.4px; opacity: 0.55;
                 text-transform: uppercase; margin: 14px 0 6px; }
    .field { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 7px 8px;
             border: 1px solid rgba(255,255,255,0.16); border-radius: 8px; background: rgba(255,255,255,0.06);
             color: #e8e8ec; font-size: 12px; }
    .field:focus { outline: none; border-color: rgba(255,255,255,0.4); }
    select.field { cursor: pointer; }
    .ai-model-wrap { position: relative; margin-top: 6px; }
    #ai-model-btn {
      width: 100%; box-sizing: border-box; padding: 7px 8px;
      border: 1px solid rgba(255,255,255,0.16); border-radius: 8px;
      background: rgba(255,255,255,0.06); color: #e8e8ec; font-size: 12px;
      cursor: pointer; text-align: left; display: flex; justify-content: space-between;
      align-items: center; gap: 8px; margin-top: 0;
    }
    #ai-model-btn:hover { border-color: rgba(255,255,255,0.4); }
    #ai-model-btn .caret { opacity: 0.6; font-size: 10px; flex-shrink: 0; }
    .model-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
      background: #1f1f26; border: 1px solid rgba(255,255,255,0.16); border-radius: 8px;
      max-height: 200px; overflow-y: auto; box-shadow: 0 10px 26px rgba(0,0,0,0.5);
    }
    .model-list .ml-head { padding: 6px 8px; font-size: 9.5px; text-transform: uppercase;
      letter-spacing: 0.4px; opacity: 0.55; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .model-list .ml-prov { padding: 2px 7px; border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px; font-size: 10px; cursor: pointer; background: none; color: #c9c9d2;
      text-transform: none; letter-spacing: 0; }
    .model-list .ml-prov.on { background: rgba(94,158,252,0.22); border-color: rgba(94,158,252,0.5); color: #9ecbff; }
    .model-list .ml-item { display: block; width: 100%; text-align: left; padding: 7px 9px;
      border: 0; border-bottom: 1px solid rgba(255,255,255,0.05); background: none;
      color: #e8e8ec; font-size: 12px; cursor: pointer; border-radius: 0; margin-top: 0; }
    .model-list .ml-item:last-child { border-bottom: none; }
    .model-list .ml-item:hover { background: rgba(255,255,255,0.08); }
    .model-list .ml-item.sel { color: #9ecbff; }
    .model-list .ml-err { padding: 8px; font-size: 11px; color: #f87171; line-height: 1.4; }
    .model-list .ml-note { padding: 8px; font-size: 10.5px; opacity: 0.7; }
    .ai-row { display: flex; gap: 8px; }
    .ai-row button { margin-top: 6px; padding: 7px; width: 50%; }
    .ai-status { font-size: 11px; margin-top: 6px; min-height: 14px; opacity: 0.75; }
    .ai-status.ok { color: #34d399; }
    .ai-status.err { color: #f87171; }
    .shield { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; cursor: pointer; }
    .shield input { cursor: pointer; }
    .shield .shield-sub { opacity: 0.55; font-size: 11px; }
    .note { margin-top: 10px; opacity: 0.6; font-size: 11px; }
    code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span id="dot" class="dot"></span> RLScript <span id="ver" class="ver"></span> <span style="font-size:9px;opacity:.6">Multi-AI</span></h1>
    <div class="row" id="state">Bridge: …</div>
    <div class="row" id="tools"></div>
    <div class="row" id="servers" style="white-space:pre-line; font-family:ui-monospace,monospace; opacity:0.75"></div>
    <button class="ghost" id="reconnect">↻ Reconnect bridge</button>
    <button class="ghost" id="restart">⟳ Restart Roblox server</button>
    <button class="ghost" id="settings">⚙ Settings</button>

    <div class="sec-title">AI-to-AI help (ask_ai)</div>
    <div class="row" style="margin-top:0">Send hard sub-problems to a second model using your own API key.</div>
    <div class="ai-model-wrap">
      <button id="ai-model-btn" type="button"><span id="ai-model-label">Choose a model…</span><span class="caret">▾</span></button>
      <div id="ai-model-list" class="model-list" hidden></div>
    </div>
    <input id="ai-key" class="field" type="password" placeholder="API key (stored only in this browser)" />
    <div class="ai-row">
      <button class="ghost" id="ai-save">Save</button>
      <button class="ghost" id="ai-clear">Clear</button>
    </div>
    <div id="ai-status" class="ai-status"></div>

    <div class="sec-title">Code fixes</div>
    <label class="shield">
      <input id="syntax-shield" type="checkbox" />
      <span>Syntax Shield<span class="shield-sub"> — refuse a rewrite that would unbalance a script (off by default)</span></span>
    </label>

    <div class="note">
      Run <code>start.bat</code> and open <b>Roblox Studio</b>, then go to a supported AI.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
